    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* Animations */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes slideInLeft {
      from { opacity: 0; transform: translateX(-30px); }
      to { opacity: 1; transform: translateX(0); }
    }

    @keyframes slideInRight {
      from { opacity: 0; transform: translateX(30px); }
      to { opacity: 1; transform: translateX(0); }
    }

    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 20px rgba(168, 85, 247, 0.3); }
      50% { box-shadow: 0 0 40px rgba(168, 85, 247, 0.6); }
    }

    @keyframes bounce-in {
      0% { opacity: 0; transform: scale(0.9); }
      50% { opacity: 1; }
      100% { transform: scale(1); }
    }

    .fade-in-up { animation: fadeInUp 0.6s ease-out; }
    .slide-in-left { animation: slideInLeft 0.6s ease-out; }
    .slide-in-right { animation: slideInRight 0.6s ease-out; }
    .pulse-glow { animation: pulse-glow 2s ease-in-out infinite; }
    .bounce-in { animation: bounce-in 0.5s ease-out; }
    
    .tool-card { 
      transition: all 0.3s ease;
      animation: fadeInUp 0.5s ease-out backwards;
    }

    .tool-card:hover { 
      transform: translateY(-8px);
      box-shadow: 0 20px 40px rgba(168, 85, 247, 0.3);
    }

    .category-btn {
      transition: all 0.3s ease;
      animation: fadeInUp 0.6s ease-out backwards;
    }

    .category-btn:hover {
      transform: translateY(-2px);
    }

    .search-input {
      transition: all 0.3s ease;
    }

    .search-input:focus {
      box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.2);
    }

    .header { animation: slideInDown 0.8s ease-out; }

    @keyframes slideInDown {
      from { opacity: 0; transform: translateY(-30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .tool-card:nth-child(1) { animation-delay: 0.1s; }
    .tool-card:nth-child(2) { animation-delay: 0.2s; }
    .tool-card:nth-child(3) { animation-delay: 0.3s; }
    .tool-card:nth-child(4) { animation-delay: 0.4s; }
    .tool-card:nth-child(5) { animation-delay: 0.5s; }
    .tool-card:nth-child(6) { animation-delay: 0.6s; }

      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;

    }

    let selectedCategory = 'All';

    // Get unique categories
    const categories = ['All', ...new Set(allTools.map(tool => tool.category))].sort((a, b) => {
      if (a === 'All') return -1;
      return a.localeCompare(b);
    });

    // Render categories with stagger animation
    const categoryContainer = document.getElementById('categoryContainer');
    categories.forEach((category, index) => {
      const btn = document.createElement('button');
      btn.textContent = category;
      btn.className = `category-btn px-4 py-2 rounded-lg font-medium transition-all whitespace-nowrap text-sm ${
        category === 'All' 
          ? 'bg-gradient-to-r from-purple-500 to-cyan-500 text-white shadow-lg' 
          : 'bg-slate-800/60 text-slate-300 border border-slate-700/50 hover:bg-slate-700/60'
      }`;
      btn.style.animationDelay = `${0.1 + index * 0.05}s`;
      btn.addEventListener('click', () => {
        selectedCategory = category;
        document.querySelectorAll('#categoryContainer button').forEach(b => {
          b.className = `category-btn px-4 py-2 rounded-lg font-medium transition-all whitespace-nowrap text-sm ${
            b.textContent === category 
              ? 'bg-gradient-to-r from-purple-500 to-cyan-500 text-white shadow-lg' 
              : 'bg-slate-800/60 text-slate-300 border border-slate-700/50 hover:bg-slate-700/60'
          }`;
        });
        renderTools();
      });
      categoryContainer.appendChild(btn);
    });

    // Get category color
    function getCategoryColor(category) {
      const colors = {
        'Image Generation': 'from-purple-500 to-pink-500',
        'Video Generation': 'from-cyan-500 to-blue-500',
        'Voice & Audio': 'from-orange-500 to-red-500',
        'Writing & Text': 'from-emerald-500 to-teal-500',
        'Coding': 'from-blue-500 to-indigo-500',
        'Design': 'from-pink-500 to-rose-500',
        'Music': 'from-violet-500 to-purple-500',
        'Search': 'from-yellow-500 to-orange-500',
        'Presentations': 'from-red-500 to-pink-500',
      };
      return colors[category] || 'from-slate-500 to-slate-600';
    }

    // Get pricing color
    function getPricingColor(pricing) {
      const colors = {
        'Free': 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/50',
        'Freemium': 'bg-blue-500/20 text-blue-300 border border-blue-500/50',
        'Paid': 'bg-purple-500/20 text-purple-300 border border-purple-500/50',
        'Limited': 'bg-yellow-500/20 text-yellow-300 border border-yellow-500/50',
      };
      return colors[pricing] || 'bg-slate-500/20 text-slate-300 border border-slate-500/50';
    }

    // Render tools with staggered animation
    function renderTools() {
      const searchTerm = document.getElementById('searchInput').value.toLowerCase();
      
      const filtered = allTools.filter(tool => {
        const matchesSearch = tool.name.toLowerCase().includes(searchTerm) || 
                            tool.description.toLowerCase().includes(searchTerm);
        const matchesCategory = selectedCategory === 'All' || tool.category === selectedCategory;
        return matchesSearch && matchesCategory;
      });

      document.getElementById('toolCount').textContent = filtered.length;

      const grid = document.getElementById('toolsGrid');
      grid.innerHTML = '';

      if (filtered.length === 0) {
        grid.innerHTML = '<div class="col-span-full text-center py-20"><p class="text-slate-400 text-lg">No tools found</p></div>';
        return;
      }

      filtered.forEach((tool, index) => {
        const card = document.createElement('div');
        card.className = 'tool-card group relative';
        card.style.animationDelay = `${0.1 + index * 0.05}s`;
        card.innerHTML = `
          <div class="relative bg-slate-800/60 backdrop-blur-sm border-2 border-slate-700/50 rounded-2xl p-6 h-full transition-all duration-300 hover:bg-slate-800/80 hover:border-purple-500/50">
            ${tool.trending ? '<span class="inline-block px-3 py-1 mb-3 rounded-full text-xs font-bold bg-orange-500/30 text-orange-300 border border-orange-500/50">🔥 Trending</span>' : ''}
            <div class="mb-4 inline-block">
              <span class="px-3 py-1.5 rounded-lg text-xs font-bold text-white bg-gradient-to-r ${getCategoryColor(tool.category)}">
                ${tool.category}
              </span>
            </div>
            <h3 class="text-xl font-bold text-white mb-2">${tool.name}</h3>
            <p class="text-slate-400 text-sm mb-5 line-clamp-3">${tool.description}</p>
            <div class="space-y-4 mt-auto">
              <span class="inline-block px-3 py-1.5 rounded-lg text-xs font-semibold ${getPricingColor(tool.pricing)}">
                ${tool.pricing}
              </span>
              <a href="${tool.link}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-2 text-purple-400 hover:text-cyan-400 font-semibold transition-colors">
                Explore →
              </a>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // Search event listener with debounce
    let searchTimeout;
    document.getElementById('searchInput').addEventListener('input', () => {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(renderTools, 150);
    });

    // Initial render
    renderTools();
  </script>
